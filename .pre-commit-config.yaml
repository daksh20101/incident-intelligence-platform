# Checks that run automatically on every `git commit`.
# One-time setup:  uv run pre-commit install
# Run on all files by hand:  uv run pre-commit run --all-files
#
# "local" hooks call the Ruff that uv already installed for this project, so the
# versions always match CI and nothing extra is downloaded.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, auto-fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, markdown]